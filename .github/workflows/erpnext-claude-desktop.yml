name: Build ERPNext Claude Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "desktop-v*"
    paths:
      - "desktop/erpnext-claude-shell/**"
      - ".github/workflows/erpnext-claude-desktop.yml"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            command: dist:windows
            artifact: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop/erpnext-claude-shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/erpnext-claude-shell/package-lock.json
      - run: npm ci
      - run: npm run ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: erpnext-claude-${{ matrix.artifact }}
          path: |
            desktop/erpnext-claude-shell/dist/*.exe
            desktop/erpnext-claude-shell/dist/*.blockmap
            desktop/erpnext-claude-shell/dist/latest.yml

  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            version="$(node -p "require('./desktop/erpnext-claude-shell/package.json').version")"
            tag="desktop-v${version}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#desktop-v}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: erpnext-claude-*
          path: release
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists. Increase package.json version before merging to main."
            exit 1
          fi
          gh release create "$RELEASE_TAG" release/* --target "$GITHUB_SHA" --generate-notes --title "ERPNext AI Desktop $RELEASE_VERSION"
